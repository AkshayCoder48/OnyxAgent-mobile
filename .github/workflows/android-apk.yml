name: Android APK Release

# Build a release APK on every push and publish it to GitHub Releases.
# Manual runs are also supported via workflow_dispatch.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: true

jobs:
  build-android:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate native Android project
        run: bunx expo prebuild -p android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
             "artifacts/OnyxAgent-v${{ github.run_number }}-${GITHUB_SHA::7}.apk"
          ls -la artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnyxAgent-APK
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create tag name
        id: tag
        run: echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Delete existing release (if re-run)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.tag.outputs.tag }}" --yes --cleanup-tag || true

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            artifacts/*.apk \
            --title "OnyxAgent Android APK (build #${{ github.run_number }})" \
            --notes "Automated APK build from commit ${{ github.sha }}.

          **Install:** Download the \`.apk\` file below, then open it on your Android device and allow installation from unknown sources.

          Built with Expo prebuild + Gradle assembleRelease. Signed with the default debug keystore." \
            --target "$GITHUB_SHA"
