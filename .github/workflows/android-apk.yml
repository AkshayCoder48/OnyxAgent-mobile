name: Android APK Release

# Build a release APK on every push, smoke-test it on an emulator,
# then publish it to GitHub Releases (only if the smoke test passes).

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: true
  PKG: ai.onyxagent.app

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate native Android project
        run: bunx expo prebuild -p android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
             "artifacts/OnyxAgent-v${{ github.run_number }}-${GITHUB_SHA::7}.apk"
          ls -la artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnyxAgent-APK
          path: artifacts/*.apk
          retention-days: 7
          if-no-files-found: error

  smoke-test:
    name: Emulator smoke test
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: OnyxAgent-APK
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check acceleration
        run: |
          ls -la /dev/kvm || true
          "$ANDROID_HOME/emulator/emulator" -accel-check || true

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install emulator & system image (API 35)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "system-images;android-35;google_apis;x86_64" \
            "platforms;android-35" "platform-tools" "emulator" 2>&1 | tail -5

      - name: Create AVD
        run: |
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name onyx \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_7

      - name: Boot emulator (headless, fail-fast)
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          nohup "$ANDROID_HOME/emulator/emulator" -avd onyx \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -memory 3072 -cores 2 \
            -gpu swiftshader_indirect > emulator.log 2>&1 &
          EMU_PID=$!
          echo "emulator pid: $EMU_PID"
          BOOT=""
          for i in $(seq 1 240); do
            sleep 3
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "EMULATOR PROCESS DIED after $((i*3))s — emulator.log tail:"
              tail -120 emulator.log
              exit 1
            fi
            BOOT=$(timeout 10 "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n')
            if [ "$BOOT" = "1" ]; then
              echo "BOOTED after $((i*3))s"
              break
            fi
          done
          if [ "$BOOT" != "1" ]; then
            echo "BOOT TIMED OUT (12 min) — emulator.log tail:"
            tail -120 emulator.log
            timeout 20 "$ADB" devices || true
            exit 1
          fi
          timeout 30 "$ADB" devices

      - name: Install & launch APK
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          timeout 120 "$ADB" install -r apk/*.apk
          timeout 20 "$ADB" logcat -c
          timeout 60 "$ADB" shell am start -W -n "$PKG/$PKG.MainActivity"

      - name: Watch for crashes (45s)
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          ALIVE=yes
          for i in $(seq 1 9); do
            sleep 5
            if timeout 10 "$ADB" shell pidof "$PKG" > /dev/null 2>&1; then
              echo "t=$((i*5))s: process alive"
            else
              echo "t=$((i*5))s: PROCESS DEAD"
              ALIVE=no
              break
            fi
          done
          echo "ALIVE=$ALIVE" >> "$GITHUB_ENV"

      - name: Capture diagnostics
        if: always()
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          timeout 60 "$ADB" logcat -d -v time > logcat.txt 2>/dev/null || echo "logcat unavailable" > logcat.txt
          timeout 20 "$ADB" shell dumpsys window 2>/dev/null | grep -E "mCurrentFocus|mFocusedApp" > focus.txt || echo "focus unavailable" > focus.txt
          timeout 30 "$ADB" exec-out screencap -p > screen.png 2>/dev/null || echo "screenshot unavailable" > screen.png
          grep -A 80 "FATAL EXCEPTION" logcat.txt > crash.txt || echo "no FATAL EXCEPTION in logcat" > crash.txt
          echo "--- crash.txt ---"
          head -100 crash.txt || true
          echo "--- focus ---"
          cat focus.txt || true
          echo "--- emulator.log tail ---"
          tail -40 emulator.log || true
          pkill -f "emulator.*avd onyx" 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-diagnostics
          path: |
            logcat.txt
            crash.txt
            focus.txt
            screen.png
            emulator.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail if crashed
        if: always()
        run: |
          if grep -q "FATAL EXCEPTION" crash.txt 2>/dev/null; then
            echo "::error::App crashed with a FATAL EXCEPTION — see smoke-test-diagnostics artifact"
            exit 1
          fi
          if [ "${ALIVE:-no}" != "yes" ]; then
            echo "::error::App process died during the watch window — see smoke-test-diagnostics artifact"
            exit 1
          fi
          echo "App survived the smoke test."

  release:
    name: Publish to GitHub Releases
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: OnyxAgent-APK
          path: apk

      - name: Create tag name
        id: tag
        run: echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Delete existing release (if re-run)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.tag.outputs.tag }}" --yes --cleanup-tag || true

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            apk/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "OnyxAgent Android APK (build #${{ github.run_number }})" \
            --notes "Automated APK build from commit ${{ github.sha }}.

          **Install:** Download the \`.apk\` file below, then open it on your Android device and allow installation from unknown sources.

          Built with Expo prebuild + Gradle assembleRelease, and verified by an automated Android 15 emulator smoke test. Signed with the default debug keystore." \
            --target "$GITHUB_SHA"
